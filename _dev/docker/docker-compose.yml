version: '3.8'

services:
  app:
    build:
      context: ../..
      dockerfile: _dev/docker/Dockerfile
    container_name: alumnilink_app
    ports:
      - "8080:80"
    volumes:
      - ../..:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=alumnilink
      - DB_USER=root
      - DB_PASS=secret
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: alumnilink_db
    restart: always
    environment:
      - MYSQL_DATABASE=alumnilink
      - MYSQL_ROOT_PASSWORD=secret
    volumes:
      - db_data:/var/lib/mysql
      - ../../schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db_data:
